name: Deploy Trigger.dev tasks

# Background jobs (renders, exports, watermark, cleanup…) run on Trigger.dev,
# not Vercel, so they're deployed separately whenever main changes.
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   secret   TRIGGER_ACCESS_TOKEN  — Trigger.dev → Account → Personal Access Tokens
#   variable TRIGGER_PROJECT_REF   — Trigger.dev → Project settings → Project ref (proj_…)
# Until both exist, the job skips with a notice instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ] || [ -z "$TRIGGER_PROJECT_REF" ]; then
            echo "::notice::Trigger.dev deploy skipped — add the TRIGGER_ACCESS_TOKEN secret and TRIGGER_PROJECT_REF variable to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
      - name: Deploy to the prod environment
        if: steps.config.outputs.ready == 'true'
        run: npx trigger.dev deploy --env prod
